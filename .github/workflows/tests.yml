name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Parking logic (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Install Home Assistant test harness
        run: pip install -r requirements_test.txt
      - name: Home Assistant tests
        # pytest-sugar (pulled in by the harness) imports distutils, gone in 3.12+
        run: python -m pytest tests_ha -p no:sugar -p no:cacheprovider
